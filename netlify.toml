    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/area-do-aluno/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/pagamento/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
